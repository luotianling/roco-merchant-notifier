name: Roco Merchant Notifier

on:
  schedule:
    # 北京时间 08:00,08:05,08:10 / 12:00,12:05,12:10 / 16:00,16:05,16:10 / 20:00,20:05,20:10
    # 对应 UTC 00:00,00:05,00:10 / 04:00,04:05,04:10 / 08:00,08:05,08:10 / 12:00,12:05,12:10
    - cron: '0,5,10 0,4,8,12 * * *'
  workflow_dispatch:   # 允许手动触发

jobs:
  run-notifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright jinja2

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install chromium --with-deps
          sudo apt-get install -y fonts-wqy-zenhei

      - name: Run Notifier Script
        env:
          ROCOM_API_KEY: ${{ secrets.ROCOM_API_KEY }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
          NOTIFYME_UUID: ${{ secrets.NOTIFYME_UUID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          UNICLOUD_URL: ${{ secrets.UNICLOUD_URL }}
        run: python main.py
